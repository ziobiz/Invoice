<!DOCTYPE html>
<html lang="en" data-shell-theme="dark">
<head>

<body>
  <!-- LOGIN -->
  <div id="loginView" class="auth-wrap">

    <div class="auth-card">
      <div class="lang-inline">
        <span data-i18n="lang.label">Language</span>
        <select id="langSelect" class="pg-select" style="width:auto" onchange="setLang(this.value)">
          <option value="ko">한국어</option>

          <option value="ja">日本語</option>
          <option value="th">ไทย</option>

      </div>
      <h1 id="authTitle" data-i18n="login.title">Admin Login</h1>
      <div id="authLogoWrap" class="hidden" style="text-align:center;margin:.5rem 0 .75rem">

      </div>
      <p class="sub" id="authSub" data-i18n="login.hint">HQ admin session</p>
      <p class="sub hidden" id="authMainText" style="white-space:pre-wrap"></p>
      <div id="authError" class="auth-error hidden"></div>

      <form id="credForm" onsubmit="return handleCredentials(event)">

          <p id="turnstileWait" class="turnstile-wait-box hidden" data-i18n="auth.turnstileWait">Checking…</p>

      <form id="changePwForm" class="hidden" onsubmit="return handleChangePw(event)">
        <label class="pg-label" data-i18n="auth.newPassword">New password</label>

      </form>

      <div id="emailOtpStep" class="hidden">
        <p class="sub" id="emailOtpHint"></p>

      </div>

      <div id="totpEnrollStep" class="hidden">
        <p class="sub" data-i18n="auth.enrollTotpHint">Scan QR with Google Authenticator, then enter 6 digits.</p>
        <img id="totpQr" alt="QR" style="display:block;margin:.5rem auto;max-width:180px" />
        <div class="otp-boxes" id="enrollOtpBoxes"></div>
      </div>

      <div id="totpLoginStep" class="hidden">
        <p class="sub" data-i18n="auth.totpHint">Enter the 6-digit code from your authenticator app.</p>
        <div class="otp-boxes" id="loginOtpBoxes"></div>
      </div>
    </div>
    </div>
    <footer id="loginFooter" class="site-footer"></footer>
  </div>

  <!-- SHELL (ICOCARD structure + shared charcoal chrome) -->
  <div id="appView" class="pg-shell hidden">
    <aside class="pg-sidebar" id="sidebar">
      <div class="pg-sidebar-logo"><img id="shellLogoImg" class="hidden" alt="" style="max-height:28px;max-width:100%;object-fit:contain" /><span id="shellLogoText" data-i18n="app.brand">Invoice</span></div>
      <div class="pg-sidebar-collapse-wrap">
        <button type="button" class="pg-sidebar-collapse" id="collapseBtn" onclick="toggleSidebar()">
          <span id="collapseChev">«</span>
          <span class="pg-sidebar-collapse-label" data-i18n="nav.collapse">Collapse</span>

      <nav class="pg-nav" id="sideNav"></nav>
    </aside>
    <div class="pg-shell-main">
      <header class="pg-session-bar">
        <div class="pg-session-inner" id="sessionBar"></div>
      </header>
      <div class="pg-tabs" id="tabBar"></div>
      <main class="pg-admin">
        <div id="flash" class="flash hidden"></div>
        <div id="content" class="pg-stack"></div>
      </main>

<script>
let I18N = {}, LANG = localStorage.getItem('invoice_lang') || (navigator.language||'en').slice(0,2);
if (!['ko','en','ja','th','zh'].includes(LANG)) LANG = 'en';
let publicCfg = { turnstileEnabled: false, turnstileSiteKey: '', turnstileDisplayMode: 'text' };
let turnstileWidgetId = null;
let turnstileToken = '';
let flow = { changeToken:'', emailToken:'', enrollToken:'', otpToken:'' };
let openTabs = ['dashboard'];
let activeTab = 'dashboard';
let adminUser = null;
let sessionIp = '—';
let sessionClockTimer = null;
let userMenuOpen = false;
let shellTheme = localStorage.getItem('invoice_shell_theme') || 'dark';
if (!['dark','default','light'].includes(shellTheme)) shellTheme = 'dark';
let tabletMode = localStorage.getItem('invoice_tablet') === '1';
let navExpanded = {};
try { navExpanded = JSON.parse(localStorage.getItem('invoice_nav_expanded') || '{}'); } catch { navExpanded = {}; }

const LANG_PILLS = [
  { code:'ko', short:'KR' },
  { code:'ja', short:'JP' },
  { code:'en', short:'US' },
  { code:'zh', short:'CH' },
  { code:'th', short:'TH' },
];
const THEMES = [
  { id:'dark', key:'theme.dark' },
  { id:'default', key:'theme.default' },
  { id:'light', key:'theme.light' },
];

const ICO = {
  dashboard: '<svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M4 13h6V4H4v9zm0 7h6v-5H4v5zm8 0h6V11h-6v9zm0-17v5h6V3h-6z"/></svg>',
  invoices: '<svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M7 3h8l4 4v14a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M15 3v4h4M9 13h6M9 17h6M9 9h2"/></svg>',
  sites: '<svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>',
  parties: '<svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="3"/><path d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a3 3 0 010 5.74"/></svg>',
  products: '<svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></svg>',
  mappings: '<svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  users: '<svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>',
  platform: '<svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  audit: '<svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M14 2H7a1 1 0 00-1 1v18a1 1 0 001 1h10a1 1 0 001-1V7l-5-5z"/><path d="M14 2v5h5M9 13h6M9 17h6M9 9h2"/></svg>',
  group: '<svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
};

const NAV = [
  { id:'dashboard', key:'nav.dashboard', icon:'dashboard' },
  { id:'invoices', key:'nav.invoices', icon:'invoices' },
  { id:'sites', key:'nav.sites', icon:'sites' },
  { id:'parties', key:'nav.parties', icon:'parties' },
  { id:'products', key:'nav.products', icon:'products' },
  { id:'mappings', key:'nav.mappings', icon:'mappings' },
  { id:'users', key:'nav.users', icon:'users' },
  { id:'platform', key:'nav.platform', icon:'platform' },
  { id:'audit', key:'nav.audit', icon:'audit' },
];

/** ICOCARD식 그룹 메뉴 */
const NAV_TREE = [
  { id:'dashboard', key:'nav.dashboard', icon:'dashboard' },
  {
    id:'grp-ops', key:'nav.group.ops', icon:'group',
    children: ['invoices','sites','parties','products','mappings'],
  },
  {
    id:'grp-system', key:'nav.group.system', icon:'platform',
    children: ['users','platform','audit'],
  },
];

function t(key, vars) {
  let text = I18N[key] || key;
  if (vars) Object.entries(vars).forEach(([k,v]) => { text = text.replaceAll('{'+k+'}', String(v)); });
  return text;
}
function intlLocale(lang) {
  return ({ ko:'ko-KR', en:'en-US', ja:'ja-JP', zh:'zh-CN', th:'th-TH' })[lang] || 'en-US';
}
function formatAccessTime(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  const h = String(date.getHours()).padStart(2,'0');
  const min = String(date.getMinutes()).padStart(2,'0');
  const sec = String(date.getSeconds()).padStart(2,'0');
  const weekday = new Intl.DateTimeFormat(intlLocale(LANG), { weekday:'short' }).format(date);
  return `${y}. ${m}. ${d} ${h}:${min}:${sec} ${weekday}`;
}
function applyShellTheme() {
  document.documentElement.setAttribute('data-shell-theme', shellTheme);
  document.documentElement.classList.toggle('tablet-mode', tabletMode);
}
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.documentElement.lang = LANG;
  const ls = document.getElementById('langSelect');
  if (ls) ls.value = LANG;
  if (!document.getElementById('appView').classList.contains('hidden')) renderSessionBar();
  applyBranding();
}
async function loadI18n(lang) {
  I18N = await (await fetch('/locales/'+lang+'.json')).json();
  LANG = lang; localStorage.setItem('invoice_lang', lang); applyI18n();
}
async function setLang(lang) {
  await loadI18n(lang);
  if (!document.getElementById('appView').classList.contains('hidden')) renderShell();
}
function setTheme(id) {
  shellTheme = id;
  localStorage.setItem('invoice_shell_theme', id);
  applyShellTheme();
  renderSessionBar();
}
function toggleTablet() {
  tabletMode = !tabletMode;
  localStorage.setItem('invoice_tablet', tabletMode ? '1' : '0');
  applyShellTheme();
  renderSessionBar();
}
function closeAllTabs() {
  if (openTabs.length <= 1) return;
  openTabs = ['dashboard'];
  activeTab = 'dashboard';
  renderShell();
  showTab('dashboard');
}
function pipe() {
  return `<span class="pg-session-pipe" aria-hidden="true">|</span>`;
}
function renderSessionBar() {
  const bar = document.getElementById('sessionBar');
  if (!bar) return;
  const canClose = openTabs.length > 1;
  const roleLabel = adminUser ? t(adminUser.role === 'viewer' ? 'role.viewer' : 'role.hq') : '';
  const name = adminUser?.name || '';
  const email = adminUser?.email || '';
  bar.innerHTML = `
    <div class="pg-session-scroll">
      <span class="pg-session-meta-label">${t('theme.label')}</span>
      <span class="pg-theme-pill">
        ${THEMES.map(th => `<button type="button" class="pg-theme-btn ${shellTheme===th.id?'pg-theme-btn-active':'pg-theme-btn-idle'}" onclick="setTheme('${th.id}')">${t(th.key)}</button>`).join('')}
      </span>
      ${pipe()}
      <label class="pg-session-meta" style="cursor:pointer;gap:.4rem">
        <span class="pg-session-meta-label">${t('session.tablet')}</span>
        <button type="button" role="switch" aria-checked="${tabletMode}" class="pg-tablet-switch ${tabletMode?'on':''}" onclick="toggleTablet()"><span></span></button>
      </label>
      ${pipe()}
      <span class="pg-session-pill" aria-label="${t('nav.language')}">
        ${LANG_PILLS.map(p => `<button type="button" class="pg-session-lang ${LANG===p.code?'pg-session-lang-active':'pg-session-lang-idle'}" onclick="setLang('${p.code}')">${p.short}</button>`).join('')}
      </span>
      ${pipe()}
      <span class="pg-session-meta">
        <span class="pg-session-meta-label">${t('session.accessIp')}</span>
        <span style="color:var(--shell-session-text-muted)">:</span>
        <span class="pg-session-meta-value" id="sessionIpVal">${sessionIp}</span>
      </span>
      ${pipe()}
      <span class="pg-session-meta">
        <span class="pg-session-meta-label">${t('session.accessTime')}</span>
        <span style="color:var(--shell-session-text-muted)">:</span>
        <span class="pg-session-meta-value" id="sessionTimeVal">${formatAccessTime(new Date())}</span>
      </span>
    </div>
    <div class="pg-session-actions">
      ${pipe()}
      <div class="pg-user-menu" id="userMenuWrap">
        <button type="button" class="pg-session-user" onclick="toggleUserMenu(event)" aria-expanded="${userMenuOpen}">
          <span class="pg-session-user-glyph" aria-hidden="true">
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
          </span>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9rem">${name} <span style="opacity:.45;margin:0 .15rem">|</span> ${roleLabel}</span>
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div class="pg-user-dropdown ${userMenuOpen?'':'hidden'}" id="userDropdown" role="menu">
          <div class="hd"><p class="n">${name}</p><p class="e">${email}</p></div>
          <button type="button" class="item" onclick="logout()">${t('nav.logout')}</button>
        </div>
      </div>
      <button type="button" class="pg-session-close ${canClose?'pg-session-close-active':'pg-session-close-idle'}" ${canClose?'onclick="closeAllTabs()"':'disabled'} aria-disabled="${!canClose}">
        <span aria-hidden="true">✕</span>
        <span>${t('nav.closeAllLabel')}</span>
      </button>
    </div>`;
}
function toggleUserMenu(e) {
  if (e) e.stopPropagation();
  userMenuOpen = !userMenuOpen;
  const dd = document.getElementById('userDropdown');
  const btn = document.querySelector('.pg-session-user');
  if (dd) dd.classList.toggle('hidden', !userMenuOpen);
  if (btn) btn.setAttribute('aria-expanded', String(userMenuOpen));
  // 드롭다운만 토글 — 전체 세션바 재렌더로 레이아웃이 밀리지 않게
}
function startSessionClock() {
  if (sessionClockTimer) clearInterval(sessionClockTimer);
  sessionClockTimer = setInterval(() => {
    const el = document.getElementById('sessionTimeVal');
    if (el) el.textContent = formatAccessTime(new Date());
  }, 1000);
}
async function loadSessionIp() {
  try {
    const r = await api('/admin/api/auth/session-info');
    sessionIp = r.ip || '—';
  } catch { sessionIp = '—'; }
  const el = document.getElementById('sessionIpVal');
  if (el) el.textContent = sessionIp;
}

const api = (path, opts={}) => fetch(path, {
  credentials:'include',
  headers:{ 'Content-Type':'application/json', 'Accept-Language': LANG, ...(opts.headers||{}) },
  ...opts
}).then(async r => {
  const data = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(data.error || t('error.generic'));
  return data;
});

function showAuthStep(step) {
  ['credForm','changePwForm','emailOtpStep','totpEnrollStep','totpLoginStep'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
  document.getElementById(step).classList.remove('hidden');
}
function setAuthError(msg) {
  const el = document.getElementById('authError');
  if (!msg) { el.classList.add('hidden'); el.textContent=''; return; }
  el.textContent = msg; el.classList.remove('hidden');
}
function buildOtp(containerId, onComplete) {
  const box = document.getElementById(containerId);
  box.innerHTML = '';
  const inputs = [];
  for (let i=0;i<6;i++) {
    const inp = document.createElement('input');
    inp.maxLength = 1; inp.inputMode = 'numeric'; inp.autocomplete = 'one-time-code';
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/g,'').slice(-1);
      if (inp.value && i < 5) inputs[i+1].focus();
      const code = inputs.map(x=>x.value).join('');
      if (code.length === 6) onComplete(code);
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !inp.value && i>0) inputs[i-1].focus();
    });
    box.appendChild(inp); inputs.push(inp);
  }
  inputs[0].focus();
}

async function mountTurnstile() {
  const box = document.getElementById('turnstileBox');
  const host = document.getElementById('turnstileHost');
  const waitEl = document.getElementById('turnstileWait');
  const okEl = document.getElementById('turnstileOk');
  const errEl = document.getElementById('turnstileErr');
  const btn = document.getElementById('loginSubmitBtn');
  const mode = publicCfg.turnstileDisplayMode === 'banner' ? 'banner' : 'text';
  destroyTurnstile();
  turnstileToken = '';
  if (!publicCfg.turnstileEnabled || !publicCfg.turnstileSiteKey) {
    box.classList.add('hidden');
    if (btn) btn.disabled = false;
    return;
  }
  box.classList.remove('hidden');
  waitEl.classList.toggle('hidden', mode === 'banner');
  if (okEl) okEl.classList.add('hidden');
  errEl.classList.add('hidden');
  host.className = mode === 'banner' ? 'turnstile-host-banner' : 'turnstile-host-text';
  if (btn) btn.disabled = true;
  const waitApi = () => new Promise((resolve) => {
    if (window.turnstile) return resolve();
    const i = setInterval(() => { if (window.turnstile) { clearInterval(i); resolve(); } }, 100);
    setTimeout(() => { clearInterval(i); resolve(); }, 15000);
  });
  await waitApi();
  if (!window.turnstile || !host) {
    waitEl.classList.add('hidden');
    errEl.classList.remove('hidden');
    errEl.textContent = t('auth.turnstileFailed');
    return;
  }
  try {
    const opts = {
      sitekey: publicCfg.turnstileSiteKey,
      theme: 'light',
      size: 'flexible',
      appearance: mode === 'text' ? 'interaction-only' : 'always',
      callback: (tok) => {
        turnstileToken = tok;
        waitEl.classList.add('hidden');
        errEl.classList.add('hidden');
        if (okEl) {
          if (mode === 'text') {
            okEl.textContent = t('auth.turnstileOk');
            okEl.classList.remove('hidden');
          } else okEl.classList.add('hidden');
        }
        if (btn) btn.disabled = false;
      },
      'expired-callback': () => {
        turnstileToken = '';
        if (btn) btn.disabled = true;
        if (okEl) okEl.classList.add('hidden');
        if (mode === 'text') waitEl.classList.remove('hidden');
      },
      'error-callback': () => {
        turnstileToken = '';
        waitEl.classList.add('hidden');
        if (okEl) okEl.classList.add('hidden');
        errEl.classList.remove('hidden');
        errEl.textContent = t('auth.turnstileFailed');
        if (btn) btn.disabled = true;
      },
    };
    turnstileWidgetId = window.turnstile.render(host, opts);
  } catch {
    waitEl.classList.add('hidden');
    errEl.classList.remove('hidden');
    errEl.textContent = t('auth.turnstileFailed');
  }
}
function destroyTurnstile() {
  try {
    if (turnstileWidgetId != null && window.turnstile) {
      window.turnstile.remove(turnstileWidgetId);
    }
  } catch { /* ignore */ }
  turnstileWidgetId = null;
  turnstileToken = '';
  const host = document.getElementById('turnstileHost');
  if (host) host.innerHTML = '';
}
function resetTurnstile() {
  turnstileToken = '';
  const btn = document.getElementById('loginSubmitBtn');
  if (publicCfg.turnstileEnabled) {
    if (btn) btn.disabled = true;
    try {
      if (turnstileWidgetId != null && window.turnstile) window.turnstile.reset(turnstileWidgetId);
      else mountTurnstile();
    } catch { mountTurnstile(); }
  } else if (btn) btn.disabled = false;
}

function showLoginOnly() {
  adminUser = null;
  userMenuOpen = false;
  if (sessionClockTimer) { clearInterval(sessionClockTimer); sessionClockTimer = null; }
  document.getElementById('appView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('content').innerHTML = '';
  document.getElementById('flash').classList.add('hidden');
  showAuthStep('credForm');
}

function clearClientAuthResidue() {
  // 인증 잔여값 제거 — 언어/테마만 localStorage에 유지 (Crypto localStorage 토큰 사고 방지)
  ['token', 'invoice_token', 'invoice_admin', 'crypto-sensitive-token'].forEach((k) => {
    try { localStorage.removeItem(k); } catch { /* ignore */ }
    try { sessionStorage.removeItem(k); } catch { /* ignore */ }
  });
  flow = { changeToken:'', emailToken:'', enrollToken:'', otpToken:'' };
  turnstileToken = '';
  adminUser = null;
  openTabs = ['dashboard'];
  activeTab = 'dashboard';
  sessionIp = '—';
}

async function fetchPublicConfig() {
  const r = await fetch('/admin/api/auth/public-config', {
    credentials: 'same-origin',
    headers: { 'Accept-Language': LANG },
  });
  if (!r.ok) throw new Error('public-config');
  return r.json();
}

async function probeSession() {
  const r = await fetch('/admin/api/auth/me', {
    credentials: 'include',
    headers: { 'Accept-Language': LANG },
  });
  if (!r.ok) return null;
  const data = await r.json().catch(() => null);
  if (!data?.admin?.id || !data.admin.email) return null;
  return data.admin;
}

async function handleCredentials(e) {
  e.preventDefault(); setAuthError('');
  try {
    if (publicCfg.turnstileEnabled && !turnstileToken) {
      setAuthError(t('auth.turnstileRequired')); return false;
    }
    const data = await api('/admin/api/auth/login', {
      method:'POST',
      body: JSON.stringify({
        email: loginEmail.value.trim().toLowerCase(),
        password: loginPassword.value,
        turnstileToken: turnstileToken || undefined,
      })
    });
    // 로그인 중간 단계에서는 절대 관리 셸을 열지 않음
    loginPassword.value = '';
    await afterLoginStep(data);
  } catch (err) {
    setAuthError(err.message);
    resetTurnstile();
  }
  return false;
}
async function handleChangePw(e) {
  e.preventDefault();
  try {
    const data = await api('/admin/api/auth/change-password', {
      method:'POST', body: JSON.stringify({ changeToken: flow.changeToken, newPassword: newPassword.value })
    });
    await afterLoginStep(data);
  } catch (err) { setAuthError(err.message); }
  return false;
}
async function afterLoginStep(data) {
  if (data.mustChangePassword) {
    flow.changeToken = data.changeToken; showAuthStep('changePwForm'); return;
  }
  if (data.needEmailOtp) {
    flow.emailToken = data.emailToken;
    emailOtpHint.textContent = t('auth.emailOtpSent', { email: data.maskedEmail });
    showAuthStep('emailOtpStep');
    buildOtp('emailOtpBoxes', async (code) => {
      try {
        const r = await api('/admin/api/auth/email-otp/verify', {
          method:'POST', body: JSON.stringify({ emailToken: flow.emailToken, code })
        });
        await afterLoginStep(r);
      } catch (err) { setAuthError(err.message); }
    });
    return;
  }
  if (data.needTotpEnroll) {
    flow.enrollToken = data.enrollToken;
    showAuthStep('totpEnrollStep');
    const start = await api('/admin/api/auth/totp/enroll/start', {
      method:'POST', body: JSON.stringify({ enrollToken: flow.enrollToken })
    });
    totpQr.src = start.qrDataUrl;
    buildOtp('enrollOtpBoxes', async (code) => {
      try {
        const r = await api('/admin/api/auth/totp/enroll/confirm', {
          method:'POST', body: JSON.stringify({ enrollToken: flow.enrollToken, code })
        });
        await afterLoginStep(r);
      } catch (err) { setAuthError(err.message); }
    });
    return;
  }
  if (data.needTotp) {
    flow.otpToken = data.otpToken;
    showAuthStep('totpLoginStep');
    buildOtp('loginOtpBoxes', async (code) => {
      try {
        const r = await api('/admin/api/auth/totp/verify', {
          method:'POST', body: JSON.stringify({ otpToken: flow.otpToken, code })
        });
        await afterLoginStep(r);
      } catch (err) { setAuthError(err.message); }
    });
    return;
  }
  if (data.admin && data.admin.id && data.admin.email) {
    // 전체 로그인 완료 응답에서만 셸 진입
    boot(data.admin);
    return;
  }
  // 알 수 없는 응답 — 셸 열지 않음
  setAuthError(t('error.generic'));
  showLoginOnly();
  resetTurnstile();
}

function boot(admin) {
  if (!admin?.id || !admin?.email) {
    showLoginOnly();
    return;
  }
  destroyTurnstile();
  flow = { changeToken:'', emailToken:'', enrollToken:'', otpToken:'' };
  turnstileToken = '';
  adminUser = admin;
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  try { sessionStorage.setItem('invoice_shell_ok', '1'); } catch { /* ignore */ }
  applyShellTheme();
  applyI18n();
  renderShell();
  startSessionClock();
  loadSessionIp();
  showTab('dashboard');
}
function toggleSidebar() {
  sidebar.classList.toggle('collapsed');
  const collapsed = sidebar.classList.contains('collapsed');
  const chev = document.getElementById('collapseChev');
  if (chev) chev.textContent = collapsed ? '»' : '«';
}
function navIcon(name) {
  return `<span class="pg-nav-icon" aria-hidden="true">${ICO[name] || ICO.group}</span>`;
}
function saveNavExpanded() {
  try { localStorage.setItem('invoice_nav_expanded', JSON.stringify(navExpanded)); } catch { /* ignore */ }
}
function toggleNavGroup(id) {
  const willOpen = !navExpanded[id];
  // 한 그룹만 펼침 (ICOCARD)
  Object.keys(navExpanded).forEach((k) => { navExpanded[k] = false; });
  navExpanded[id] = willOpen;
  saveNavExpanded();
  renderShell();
}
function renderSideNav() {
  const parts = [];
  for (const node of NAV_TREE) {
    if (node.children) {
      const open = Boolean(navExpanded[node.id]) || node.children.includes(activeTab);
      if (node.children.includes(activeTab)) navExpanded[node.id] = true;
      parts.push(`
        <button type="button" class="pg-nav-group-btn ${open?'open':''}" onclick="toggleNavGroup('${node.id}')">
          ${navIcon(node.icon)}
          <span class="pg-nav-label">${t(node.key)}</span>
          <span class="pg-nav-chevron">▾</span>
        </button>
        <div class="pg-nav-children ${open?'':'hidden'}">
          ${node.children.map((cid) => {
            const n = NAV.find((x) => x.id === cid);
            if (!n) return '';
            return `<button type="button" class="pg-nav-item ${activeTab===n.id?'active':''}" onclick="showTab('${n.id}')">
              ${navIcon(n.icon)}
              <span class="pg-nav-label">${t(n.key)}</span>
            </button>`;
          }).join('')}
        </div>`);
    } else {
      parts.push(`<button type="button" class="pg-nav-item ${activeTab===node.id?'active':''}" onclick="showTab('${node.id}')">
        ${navIcon(node.icon)}
        <span class="pg-nav-label">${t(node.key)}</span>
      </button>`);
    }
  }
  sideNav.innerHTML = parts.join('');
}

function renderShell() {
  renderSideNav();
  tabBar.innerHTML = openTabs.map(id => {
    const n = NAV.find(x=>x.id===id);
    const canClose = id !== 'dashboard' || openTabs.length > 1;
    return `<button class="${activeTab===id?'active':''}" onclick="showTab('${id}')">${t(n?.key||id)}${canClose && id!=='dashboard'?`<span class="pg-tab-x" onclick="event.stopPropagation();closeTab('${id}')">✕</span>`:''}</button>`;
  }).join('');
  renderSessionBar();
}

function closeTab(id) {
  if (id === 'dashboard' && openTabs.length === 1) return;
  openTabs = openTabs.filter(x => x !== id);
  if (!openTabs.length) openTabs = ['dashboard'];
  if (activeTab === id) activeTab = openTabs[openTabs.length-1];
  renderShell();
  showTab(activeTab);
}

async function uploadBrand(asset, input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch('/admin/api/platform/branding/' + asset, {
      method: 'POST', credentials: 'include', body: fd, headers: { 'Accept-Language': LANG },
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || t('error.generic'));
    flash(t('platform.assetUploaded'));
    await applyBranding();
    platform();
  } catch (err) {
    flash(err.message || t('error.generic'));
  }
}

async function saveBrandTexts() {
  await api('/admin/api/platform', { method:'PUT', body: JSON.stringify({
    siteName: pSiteName.value,
    tabTitle: pTabTitle.value,
    authMainText: pAuthMain.value,
    ogTitle: pOgTitle.value,
    ogDescription: pOgDesc.value,
    footerText: pFooter.value,
  })});
  flash(t('platform.saved'));
  await applyBranding();
  platform();
}

async function applyBranding() {
  try {
    const b = await fetch('/api/branding', { credentials: 'same-origin' }).then((r) => r.json());
    const title = b.tabTitle || b.siteName || t('app.title');
    document.title = title;
    if (b.faviconUrl) {
      let link = document.querySelector('link[rel="icon"]');
      if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
      link.href = b.faviconUrl;
    }
    const shellImg = document.getElementById('shellLogoImg');
    const shellText = document.getElementById('shellLogoText');
    if (shellImg && shellText) {
      if (b.logoUrl) {
        shellImg.src = b.logoUrl;
        shellImg.classList.remove('hidden');
        shellText.classList.add('hidden');
      } else {
        shellImg.classList.add('hidden');
        shellText.classList.remove('hidden');
        shellText.textContent = b.siteName || t('app.brand');
      }
    }
    const authWrap = document.getElementById('authLogoWrap');
    const authImg = document.getElementById('authLogoImg');
    if (authWrap && authImg) {
      if (b.authLogoUrl || b.logoUrl) {
        authImg.src = b.authLogoUrl || b.logoUrl;
        authWrap.classList.remove('hidden');
      } else authWrap.classList.add('hidden');
    }
    const mainText = document.getElementById('authMainText');
    if (mainText) {
      if (b.authMainText) {
        mainText.textContent = b.authMainText;
        mainText.classList.remove('hidden');
      } else {
        mainText.textContent = '';
        mainText.classList.add('hidden');
      }
    }
    const footerText = String(b.footerText || '').trim() || b.siteName || t('app.brand');
    ['loginFooter', 'shellFooter'].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.textContent = footerText;
    });
  } catch { /* ignore */ }
}

function esc(s){
  return String(s??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

(async function init(){
  // 1) 항상 로그인 화면부터 — 잔여 키/상태로 관리 창이 먼저 보이지 않게
  showLoginOnly();
  applyShellTheme();
  await loadI18n(LANG);

  try {
    publicCfg = await fetchPublicConfig();
  } catch {
    publicCfg = { turnstileEnabled: false, turnstileSiteKey: '', turnstileDisplayMode: 'text' };
  }

  // 2) 이 탭에서 로그인 완료 표시가 있을 때만 세션 복원 (Crypto sessionStorage 토큰과 동일 취지)
  let tabOk = false;
  try { tabOk = sessionStorage.getItem('invoice_shell_ok') === '1'; } catch { tabOk = false; }

  if (tabOk) {
    const admin = await probeSession().catch(() => null);
    if (admin?.id && admin.email) {
      boot(admin);
      return;
    }
  }

  // 쿠키만 있거나 탭 표시 없음 → 관리 창 금지, 서버 세션·클라이언트 잔여 정리
  try { sessionStorage.removeItem('invoice_shell_ok'); } catch { /* ignore */ }
  clearClientAuthResidue();
  try {
    await fetch('/admin/api/auth/logout', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' }, body: '{}',
    });
  } catch { /* ignore */ }

  showLoginOnly();
  await mountTurnstile();
  applyI18n();
})();
</script>
