<body>
  <!-- LOGIN -->

          <option value="en">English</option>
          <option value="ja">日本語</option>

/** ICOCARD식 그룹 메뉴 — 운영메뉴얼은 시스템과 별도 최상위, 업데이트기록은 시스템(운영기록 아래) */

    children: ['invoices','sites','parties','products','mappings'],

function t(key, vars) {
  let text = I18N[key] || key;
  if (vars) Object.entries(vars).forEach(([k,v]) => { text = text.replaceAll('{'+k+'}', String(v)); });
  return text;
}
function intlLocale(lang) {
  return ({ ko:'ko-KR', en:'en-US', ja:'ja-JP', zh:'zh-CN', th:'th-TH' })[lang] || 'en-US';
}
function formatAccessTime(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  const h = String(date.getHours()).padStart(2,'0');
  const min = String(date.getMinutes()).padStart(2,'0');
  const sec = String(date.getSeconds()).padStart(2,'0');
  const weekday = new Intl.DateTimeFormat(intlLocale(LANG), { weekday:'short' }).format(date);
  return `${y}. ${m}. ${d} ${h}:${min}:${sec} ${weekday}`;
}
function applyShellTheme() {
  document.documentElement.setAttribute('data-shell-theme', shellTheme);
  document.documentElement.classList.toggle('tablet-mode', tabletMode);
  const shell = document.getElementById('appView');
  if (shell) shell.classList.toggle('is-help-on', helpOn);
  syncHelloBtn();
}
function syncHelloBtn() {
  const btn = document.getElementById('helloBtn');
  if (!btn) return;
  btn.textContent = t('hello.label');
  btn.title = t('hello.hint');
  btn.classList.toggle('on', helpOn);
}
function toggleHello() {
  helpOn = !helpOn;
  localStorage.setItem('invoice_help_on', helpOn ? '1' : '0');
  applyShellTheme();
}
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.documentElement.lang = LANG;
  const ls = document.getElementById('langSelect');
  if (ls) ls.value = LANG;
  if (!document.getElementById('appView').classList.contains('hidden')) renderSessionBar();
  applyBranding();
}
async function loadI18n(lang) {
  I18N = await (await fetch('/locales/'+lang+'.json?v=20260921updNav1')).json();
  LANG = lang; localStorage.setItem('invoice_lang', lang); applyI18n();
}
async function setLang(lang) {
  await loadI18n(lang);
  if (!document.getElementById('appView').classList.contains('hidden')) renderShell();
}
function setTheme(id) {
  shellTheme = id;
  localStorage.setItem('invoice_shell_theme', id);
  applyShellTheme();
  renderSessionBar();
}
function toggleTablet() {
  tabletMode = !tabletMode;
  localStorage.setItem('invoice_tablet', tabletMode ? '1' : '0');
  applyShellTheme();
  renderSessionBar();
}
function closeAllTabs() {
  if (openTabs.length <= 1) return;
  openTabs = ['dashboard'];
  activeTab = 'dashboard';
  renderShell();
  showTab('dashboard');
}
function pipe() {
  return `<span class="pg-session-pipe" aria-hidden="true">|</span>`;
}
function renderSessionBar() {
  const bar = document.getElementById('sessionBar');
  if (!bar) return;
  const canClose = openTabs.length > 1;
  const roleLabel = adminUser ? t(adminUser.role === 'viewer' ? 'role.viewer' : 'role.hq') : '';
  const name = adminUser?.name || '';
  const email = adminUser?.email || '';
  bar.innerHTML = `
    <div class="pg-session-scroll">
      <span class="pg-session-meta-label">${t('theme.label')}</span>
      <span class="pg-theme-pill">
        ${THEMES.map(th => `<button type="button" class="pg-theme-btn ${shellTheme===th.id?'pg-theme-btn-active':'pg-theme-btn-idle'}" onclick="setTheme('${th.id}')">${t(th.key)}</button>`).join('')}
      </span>
      ${pipe()}
      <label class="pg-session-meta" style="cursor:pointer;gap:.4rem">
        <span class="pg-session-meta-label">${t('session.tablet')}</span>
        <button type="button" role="switch" aria-checked="${tabletMode}" class="pg-tablet-switch ${tabletMode?'on':''}" onclick="toggleTablet()"><span></span></button>
      </label>
      ${pipe()}
      <span class="pg-session-pill" aria-label="${t('nav.language')}">
        ${LANG_PILLS.map(p => `<button type="button" class="pg-session-lang ${LANG===p.code?'pg-session-lang-active':'pg-session-lang-idle'}" onclick="setLang('${p.code}')">${p.short}</button>`).join('')}
      </span>
      ${pipe()}
      <span class="pg-session-meta">
        <span class="pg-session-meta-label">${t('session.accessIp')}</span>
        <span style="color:var(--shell-session-text-muted)">:</span>
        <span class="pg-session-meta-value" id="sessionIpVal">${sessionIp}</span>
      </span>
      ${pipe()}
      <span class="pg-session-meta">
        <span class="pg-session-meta-label">${t('session.accessTime')}</span>
        <span style="color:var(--shell-session-text-muted)">:</span>
        <span class="pg-session-meta-value" id="sessionTimeVal">${formatAccessTime(new Date())}</span>
      </span>
    </div>
    <div class="pg-session-actions">
      ${pipe()}
      <div class="pg-user-menu" id="userMenuWrap">
        <button type="button" class="pg-session-user" onclick="toggleUserMenu(event)" aria-expanded="${userMenuOpen}">
          <span class="pg-session-user-glyph" aria-hidden="true">
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
          </span>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9rem">${name} <span style="opacity:.45;margin:0 .15rem">|</span> ${roleLabel}</span>
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div class="pg-user-dropdown ${userMenuOpen?'':'hidden'}" id="userDropdown" role="menu">
          <div class="hd"><p class="n">${name}</p><p class="e">${email}</p></div>
          <button type="button" class="item" onclick="logout()">${t('nav.logout')}</button>
        </div>
      </div>
      <button type="button" class="pg-session-close ${canClose?'pg-session-close-active':'pg-session-close-idle'}" ${canClose?'onclick="closeAllTabs()"':'disabled'} aria-disabled="${!canClose}">
        <span aria-hidden="true">✕</span>
        <span>${t('nav.closeAllLabel')}</span>

}
function toggleUserMenu(e) {
  if (e) e.stopPropagation();
  userMenuOpen = !userMenuOpen;
  const dd = document.getElementById('userDropdown');
  const btn = document.querySelector('.pg-session-user');
  if (dd) dd.classList.toggle('hidden', !userMenuOpen);
  if (btn) btn.setAttribute('aria-expanded', String(userMenuOpen));
  // 드롭다운만 토글 — 전체 세션바 재렌더로 레이아웃이 밀리지 않게
}
function startSessionClock() {
  if (sessionClockTimer) clearInterval(sessionClockTimer);
  sessionClockTimer = setInterval(() => {
    const el = document.getElementById('sessionTimeVal');
    if (el) el.textContent = formatAccessTime(new Date());
  }, 1000);
}
async function loadSessionIp() {
  try {
    const r = await api('/admin/api/auth/session-info');
    sessionIp = r.ip || '—';
  } catch { sessionIp = '—'; }
  const el = document.getElementById('sessionIpVal');
  if (el) el.textContent = sessionIp;

const api = (path, opts={}) => fetch(path, {
  credentials:'include',
  headers:{ 'Content-Type':'application/json', 'Accept-Language': LANG, ...(opts.headers||{}) },
  ...opts
}).then(async r => {
  const data = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(data.error || t('error.generic'));
  return data;
});

function showAuthStep(step) {
  ['credForm','changePwForm','emailOtpStep','totpEnrollStep','totpLoginStep'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
  document.getElementById(step).classList.remove('hidden');
}
function setAuthError(msg) {
  const el = document.getElementById('authError');
  if (!msg) { el.classList.add('hidden'); el.textContent=''; return; }
  el.textContent = msg; el.classList.remove('hidden');
}
function buildOtp(containerId, onComplete) {
  const box = document.getElementById(containerId);
  box.innerHTML = '';
  const inputs = [];
  for (let i=0;i<6;i++) {
    const inp = document.createElement('input');
    inp.maxLength = 1; inp.inputMode = 'numeric'; inp.autocomplete = 'one-time-code';
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/g,'').slice(-1);
      if (inp.value && i < 5) inputs[i+1].focus();
      const code = inputs.map(x=>x.value).join('');
      if (code.length === 6) onComplete(code);
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !inp.value && i>0) inputs[i-1].focus();
    });
    box.appendChild(inp); inputs.push(inp);
  }
  inputs[0].focus();
}

async function mountTurnstile() {
  const box = document.getElementById('turnstileBox');
  const host = document.getElementById('turnstileHost');
  const waitEl = document.getElementById('turnstileWait');
  const okEl = document.getElementById('turnstileOk');
  const errEl = document.getElementById('turnstileErr');
  const btn = document.getElementById('loginSubmitBtn');
  const mode = publicCfg.turnstileDisplayMode === 'banner' ? 'banner' : 'text';
  destroyTurnstile();
  turnstileToken = '';
  if (!publicCfg.turnstileEnabled || !publicCfg.turnstileSiteKey) {
    box.classList.add('hidden');
    if (btn) btn.disabled = false;
    return;
  }
  box.classList.remove('hidden');
  waitEl.classList.toggle('hidden', mode === 'banner');
  if (okEl) okEl.classList.add('hidden');
  errEl.classList.add('hidden');
  host.className = mode === 'banner' ? 'turnstile-host-banner' : 'turnstile-host-text';
  if (btn) btn.disabled = true;
  const waitApi = () => new Promise((resolve) => {
    if (window.turnstile) return resolve();
    const i = setInterval(() => { if (window.turnstile) { clearInterval(i); resolve(); } }, 100);
    setTimeout(() => { clearInterval(i); resolve(); }, 15000);
  });
  await waitApi();
  if (!window.turnstile || !host) {
    waitEl.classList.add('hidden');
    errEl.classList.remove('hidden');
    errEl.textContent = t('auth.turnstileFailed');
    return;
  }
  try {
    const opts = {
      sitekey: publicCfg.turnstileSiteKey,
      theme: 'light',
      size: 'flexible',
      appearance: mode === 'text' ? 'interaction-only' : 'always',
      callback: (tok) => {
        turnstileToken = tok;
        waitEl.classList.add('hidden');
        errEl.classList.add('hidden');
        if (okEl) {
          if (mode === 'text') {
            okEl.textContent = t('auth.turnstileOk');
            okEl.classList.remove('hidden');
          } else okEl.classList.add('hidden');
        }
        if (btn) btn.disabled = false;
      },
      'expired-callback': () => {
        turnstileToken = '';
        if (btn) btn.disabled = true;
        if (okEl) okEl.classList.add('hidden');
        if (mode === 'text') waitEl.classList.remove('hidden');
      },
      'error-callback': () => {
        turnstileToken = '';
        waitEl.classList.add('hidden');
        if (okEl) okEl.classList.add('hidden');
        errEl.classList.remove('hidden');
        errEl.textContent = t('auth.turnstileFailed');
        if (btn) btn.disabled = true;
      },
    };
    turnstileWidgetId = window.turnstile.render(host, opts);
  } catch {
    waitEl.classList.add('hidden');
    errEl.classList.remove('hidden');
    errEl.textContent = t('auth.turnstileFailed');
  }
}
function destroyTurnstile() {
  try {
    if (turnstileWidgetId != null && window.turnstile) {
      window.turnstile.remove(turnstileWidgetId);
    }
  } catch { /* ignore */ }
  turnstileWidgetId = null;
  turnstileToken = '';
  const host = document.getElementById('turnstileHost');
  if (host) host.innerHTML = '';
}
function resetTurnstile() {
  turnstileToken = '';
  const btn = document.getElementById('loginSubmitBtn');
  if (publicCfg.turnstileEnabled) {
    if (btn) btn.disabled = true;
    try {
      if (turnstileWidgetId != null && window.turnstile) window.turnstile.reset(turnstileWidgetId);
      else mountTurnstile();
    } catch { mountTurnstile(); }
  } else if (btn) btn.disabled = false;
}

async function handleCredentials(e) {
  e.preventDefault(); setAuthError('');
  try {
    if (publicCfg.turnstileEnabled && !turnstileToken) {
      setAuthError(t('auth.turnstileRequired')); return false;
    }
    const data = await api('/admin/api/auth/login', {
      method:'POST',
      body: JSON.stringify({
        email: loginEmail.value.trim().toLowerCase(),
        password: loginPassword.value,
        turnstileToken: turnstileToken || undefined,
      })
    });
    // 로그인 중간 단계에서는 절대 관리 셸을 열지 않음
    loginPassword.value = '';
    await afterLoginStep(data);
  } catch (err) {
    setAuthError(err.message);
    resetTurnstile();
  }
  return false;
}
async function handleChangePw(e) {
  e.preventDefault();
  try {
    const data = await api('/admin/api/auth/change-password', {
      method:'POST', body: JSON.stringify({ changeToken: flow.changeToken, newPassword: newPassword.value })
    });
    await afterLoginStep(data);
  } catch (err) { setAuthError(err.message); }
  return false;
}
async function afterLoginStep(data) {
  if (data.mustChangePassword) {
    flow.changeToken = data.changeToken; showAuthStep('changePwForm'); return;
  }
  if (data.needEmailOtp) {
    flow.emailToken = data.emailToken;
    emailOtpHint.textContent = t('auth.emailOtpSent', { email: data.maskedEmail });
    showAuthStep('emailOtpStep');
    buildOtp('emailOtpBoxes', async (code) => {
      try {
        const r = await api('/admin/api/auth/email-otp/verify', {
          method:'POST', body: JSON.stringify({ emailToken: flow.emailToken, code })
        });
        await afterLoginStep(r);
      } catch (err) { setAuthError(err.message); }
    });
    return;
  }
  if (data.needTotpEnroll) {
    flow.enrollToken = data.enrollToken;
    showAuthStep('totpEnrollStep');
    const start = await api('/admin/api/auth/totp/enroll/start', {
      method:'POST', body: JSON.stringify({ enrollToken: flow.enrollToken })
    });
    totpQr.src = start.qrDataUrl;
    buildOtp('enrollOtpBoxes', async (code) => {
      try {
        const r = await api('/admin/api/auth/totp/enroll/confirm', {
          method:'POST', body: JSON.stringify({ enrollToken: flow.enrollToken, code })
        });
        await afterLoginStep(r);
      } catch (err) { setAuthError(err.message); }
    });
    return;
  }
  if (data.needTotp) {
    flow.otpToken = data.otpToken;
    showAuthStep('totpLoginStep');
    buildOtp('loginOtpBoxes', async (code) => {
      try {
        const r = await api('/admin/api/auth/totp/verify', {
          method:'POST', body: JSON.stringify({ otpToken: flow.otpToken, code })
        });
        await afterLoginStep(r);
      } catch (err) { setAuthError(err.message); }
    });
    return;
  }
  if (data.admin && data.admin.id && data.admin.email) {
    // 전체 로그인 완료 응답에서만 셸 진입
    boot(data.admin);
    return;
  }
  // 알 수 없는 응답 — 셸 열지 않음
  setAuthError(t('error.generic'));
  showLoginOnly();
  resetTurnstile();
}

function boot(admin) {
  if (!admin?.id || !admin?.email) {

    return;

  destroyTurnstile();
  flow = { changeToken:'', emailToken:'', enrollToken:'', otpToken:'' };

}

function renderSideNav() {
  const parts = [];
  for (const node of NAV_TREE) {
    if (node.children) {
      const open = Boolean(navExpanded[node.id]) || node.children.includes(activeTab);
      if (node.children.includes(activeTab)) navExpanded[node.id] = true;
      parts.push(`
        <button type="button" class="pg-nav-group-btn ${open?'open':''}" onclick="toggleNavGroup('${node.id}')">
          ${navIcon(node.icon)}
          <span class="pg-nav-label">${t(node.key)}</span>
          <span class="pg-nav-chevron">▾</span>
        </button>
        <div class="pg-nav-children ${open?'':'hidden'}">
          ${node.children.map((cid) => {
            const n = NAV.find((x) => x.id === cid);
            if (!n) return '';
            return `<button type="button" class="pg-nav-item ${activeTab===n.id?'active':''}" onclick="showTab('${n.id}')">
              ${navIcon(n.icon)}
              <span class="pg-nav-label">${t(n.key)}</span>
            </button>`;
          }).join('')}
        </div>`);
    } else {
      parts.push(`<button type="button" class="pg-nav-item ${activeTab===node.id?'active':''}" onclick="showTab('${node.id}')">
        ${navIcon(node.icon)}
        <span class="pg-nav-label">${t(node.key)}</span>
      </button>`);
    }
  }
  sideNav.innerHTML = parts.join('');
}

function escHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]));
}

function fmtMoney(amount, currency) {
  const n = Number(amount);
  const cur = String(currency || '').toUpperCase();
  const noFraction = cur === 'JPY' || cur === 'KRW';
  const digits = noFraction ? 0 : 2;
  if (!Number.isFinite(n)) return String(amount ?? '');
  return n.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function fmtCurrency(currency) {
  const cur = String(currency || '').toUpperCase();
  return cur || '—';
}

function fmtIssued(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '—';
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function invoiceKindOf(row) {
  if (row.invoice_kind === 'simulator' || row.is_simulator) return 'simulator';
  if (row.invoice_kind === 'sandbox' || row.is_sandbox) return 'sandbox';
  return 'live';
}

async function invoices() {
  const qParams = new URLSearchParams({
    limit: '100',
    kind: invoiceKindFilter,
    site: invoiceSiteFilter,
    from: invoiceFrom,
    to: invoiceTo,
  });
  if (invoiceQField && invoiceQ) {
    qParams.set('qField', invoiceQField);
    qParams.set('q', invoiceQ);
  }
  const [data, sites] = await Promise.all([
    api(`/admin/api/invoices?${qParams.toString()}`),
    api('/admin/api/sites'),
  ]);
  const kindBadge = (row) => {
    const kind = invoiceKindOf(row);
    return `<span class="inv-kind inv-kind-${kind}">${t('invoices.badge.'+kind)}</span>`;
  };
  const statusLabel = (status, deletedAt) => {
    if (status === 'void' || deletedAt) return t('invoices.status.void');
    return t('invoices.status.'+status) || status;
  };
  /** Display status for list: 정상 / 수정 / 재생성 / 재발급 / 삭제 */
  const displayStatus = (row) => {
    if (row.status === 'void' || row.deleted_at) {
      return { key: 'void', cls: 'inv-status-deleted' };
    }
    if (row.status === 'reissued' || row.reissued_from_id) {
      return { key: 'reissued', cls: 'inv-status-reissued' };
    }
    const issued = row.issued_at ? new Date(row.issued_at).getTime() : 0;
    const editedAt = row.content_edited_at ? new Date(row.content_edited_at).getTime() : 0;
    const regenAt = row.pdf_regenerated_at ? new Date(row.pdf_regenerated_at).getTime() : 0;
    if (editedAt && editedAt > issued + 1000) {
      return { key: 'edited', cls: 'inv-status-edited' };
    }
    if (regenAt && regenAt > issued + 1000) {
      return { key: 'regenerated', cls: 'inv-status-regenerated' };
    }
    return { key: 'normal', cls: 'inv-status-normal' };
  };
  const statusHtml = (row) => {
    const d = displayStatus(row);
    return `<span class="${d.cls}">${escHtml(t('invoices.status.' + d.key))}</span>`;
  };
  const actorLabel = (i) => {
    const alias = (i.last_actor_alias || '').trim();
    const email = (i.last_actor_email || '').trim();
    const name = (i.last_actor_name || '').trim();
    if (alias) return escHtml(alias);
    if (email) return escHtml(email);
    if (name) return escHtml(name);
    // Webhook / site API issue — no admin actor
    if (i.created_by === 'api' || i.created_by === 'system') {
      return escHtml(t('invoices.user.api'));
    }
    return '—';
  };
  const ticketLabel = (row) => {
    const ticket = String(row.ticket_no || '');
    if (ticket && !ticket.startsWith('SIM-')) return escHtml(ticket);
    if (invoiceKindOf(row) === 'simulator') return t('invoices.badge.simulator');
    return '—';
  };
  const siteOptions = [`<option value="">${t('invoices.filter.siteAll')}</option>`]
    .concat((sites.items || []).map((s) => `<option value="${escHtml(s.code)}" ${invoiceSiteFilter===s.code?'selected':''}>${escHtml(s.name || s.code)} (${escHtml(s.code)})</option>`))
    .join('');
  const kindOptions = [
    ['all', 'invoices.filter.all'],
    ['live', 'invoices.filter.live'],
    ['simulator', 'invoices.filter.simulator'],
    ['sandbox', 'invoices.filter.sandbox'],
  ].map(([v, key]) => `<option value="${v}" ${invoiceKindFilter===v?'selected':''}>${t(key)}</option>`).join('');
  const pdfLangOptions = [
    ['en', 'invoices.pdfLang.en'],
    ['ko', 'invoices.pdfLang.ko'],
    ['ja', 'invoices.pdfLang.ja'],
    ['th', 'invoices.pdfLang.th'],
    ['zh', 'invoices.pdfLang.zh'],
  ].map(([v, key]) => `<option value="${v}" ${invoicePdfLang===v?'selected':''}>${t(key)}</option>`).join('');
  const qFieldOptions = [
    ['', 'invoices.filter.qFieldNone'],
    ['all', 'invoices.filter.qField.all'],
    ['ticket', 'invoices.filter.qField.ticket'],
    ['amount', 'invoices.filter.qField.amount'],
    ['status', 'invoices.filter.qField.status'],
    ['site', 'invoices.filter.qField.site'],
    ['invoice_no', 'invoices.filter.qField.invoiceNo'],

    return `<div class="inv-manage-flat">
      <button type="button" class="pg-btn" onclick="previewInvoicePdf('${id}')">${t('invoices.preview')}</button>
      <button type="button" class="pg-btn" onclick="editInvoice('${id}')">${t('invoices.edit')}</button>

      <button type="button" class="pg-btn" onclick="regenerateInvoicePdf('${id}')">${t('invoices.regeneratePdf')}</button>
      <button type="button" class="pg-btn ${reissueCls}" onclick="reissueInvoice('${id}')">${t('invoices.reissue')}</button>
      <button type="button" class="pg-btn pg-btn-danger" onclick="deleteInvoice('${id}')">${t('invoices.delete')}</button>
    </div>`;
  };
  content.innerHTML = `<div class="pg-card"><div class="pg-card-head">${t('invoices.title')}</div><div class="pg-card-body">
    <p class="pg-card-hint">${t('invoices.hint')}</p>
    <div class="inv-search">
      <label>${t('invoices.filter.site')}<select class="pg-select" id="invSite">${siteOptions}</select></label>
      <label>${t('invoices.filter.kind')}<select class="pg-select" id="invKind">${kindOptions}</select></label>
      <label>${t('invoices.filter.qField')}<select class="pg-select" id="invQField" onchange="onInvoiceQFieldChange()">${qFieldOptions}</select></label>
      <label>${t('invoices.filter.q')}<input class="pg-input inv-q" id="invQ" type="text" value="${escHtml(invoiceQ)}" placeholder="${escHtml(t('invoices.filter.qPlaceholder'))}" ${qEnabled?'':'disabled'}/></label>
      <label>${t('invoices.filter.from')}<input class="pg-input" id="invFrom" type="date" value="${escHtml(invoiceFrom)}"/></label>
      <label>${t('invoices.filter.to')}<input class="pg-input" id="invTo" type="date" value="${escHtml(invoiceTo)}"/></label>
      <label>${t('invoices.pdfLang')}<select class="pg-select" id="invPdfLang">${pdfLangOptions}</select></label>
      <button class="pg-btn pg-btn-primary" type="button" onclick="applyInvoiceSearch()">${t('invoices.filter.search')}</button>
    </div>
    <table class="pg-table inv-table"><thead><tr>
      <th>${t('invoices.col.issued')}</th>
      <th>${t('invoices.col.no')}</th>
      <th>${t('invoices.col.site')}</th>
      <th>${t('invoices.tag.buyer')}</th>
      <th>${t('invoices.tag.seller')}</th>
      <th>${t('invoices.col.kind')}</th>
      <th>${t('invoices.col.ticket')}</th>
      <th>${t('invoices.col.currency')}</th>
      <th>${t('invoices.col.amount')}</th>
      <th>${t('invoices.col.status')}</th>
      <th>${t('invoices.col.eventAt')}</th>
      <th>${t('invoices.col.event')}</th>
      <th>${t('invoices.col.user')}</th>
      <th class="inv-col-manage">${t('invoices.col.manage')}</th>
    </tr></thead>
    <tbody>${data.items.map(i=>{
      const deleted = i.status === 'void' || !!i.deleted_at;
      const rowClass = [
        'inv-row',
        deleted ? 'inv-row-deleted' : '',
      ].filter(Boolean).join(' ');
      return `<tr class="${rowClass}" data-inv-id="${i.id}" data-status="${escHtml(i.status||'')}" ondblclick="onInvoiceRowDbl(event,'${i.id}')">
      <td>${fmtIssued(i.issued_at)}</td>

      <td>${escHtml(i.site_code)}</td>
      <td class="mono inv-party-code">${escHtml(i.buyer_code || '—')}</td>
      <td class="mono inv-party-code">${escHtml(i.seller_code || '—')}</td>

      <td>${fmtEventKind(i)}</td>

      <td class="inv-col-manage">${deleted ? '—' : manageMenu(i.id, i.status)}</td>
    </tr>`;
    }).join('') || `<tr><td colspan="14">${t('invoices.empty')}</td></tr>`}</tbody></table>

}

function eventInfo(row) {
  const deletedAt = row.deleted_at ? new Date(row.deleted_at).getTime() : 0;
  if (row.status === 'void' || deletedAt) {
    return { at: row.deleted_at || row.updated_at, kind: 'delete' };
  }
  const issued = row.issued_at ? new Date(row.issued_at).getTime() : 0;
  const editedAt = row.content_edited_at ? new Date(row.content_edited_at).getTime() : 0;
  const regen = row.pdf_regenerated_at ? new Date(row.pdf_regenerated_at).getTime() : 0;
  if (editedAt && editedAt > issued + 1000) {
    return { at: row.content_edited_at, kind: 'edit' };
  }
  if (regen && regen > issued + 1000) {
    return { at: row.pdf_regenerated_at, kind: 'regen' };
  }
  return null;
}

function fmtEventAt(row) {
  const info = eventInfo(row);
  return info?.at ? fmtIssued(info.at) : '—';
}

function fmtEventKind(row) {
  const info = eventInfo(row);
  if (!info) return '—';
  if (info.kind === 'delete') return `<span class="touch-delete">${t('invoices.event.delete')}</span>`;
  if (info.kind === 'regen') return `<span class="touch-regen">${t('invoices.event.regen')}</span>`;
  return `<span class="touch-edit">${t('invoices.event.edit')}</span>`;
}

async function deleteInvoice(id) {

  await api(`/admin/api/invoices/${id}`, { method: 'DELETE', body: '{}' });
  flash(t('invoices.deleteOk'));
  invoices();

async function onInvoiceRowDbl(ev, id) {
  if (ev.target.closest('button, a, input, select, textarea, .inv-col-manage')) return;
  const tr = ev.currentTarget;
  const st = tr?.dataset?.status || '';
  if (tr && (tr.classList.contains('inv-row-deleted') || st === 'reissued' || st === 'void')) return;
  editInvoice(id);
}

async function requestInvoiceEditOtp() {
  const d = await api('/admin/api/auth/users/sensitive-otp', { method: 'POST', body: '{}' });
  flash(d.mode === 'totp' ? t('users.otpTotpHint') : t('users.otpEmailSent', { email: d.emailMasked || '' }));
}

async function saveInvoiceEdit(id) {
  let otp = document.getElementById('editInvOtp')?.value?.trim() || '';
  if (!otp) otp = prompt(t('users.otpPrompt')) || '';
  otp = String(otp).trim();
  if (!otp) {
    flash(t('users.otpRequired'));
    return;
  }
  const lang = document.getElementById('invPdfLang')?.value || 'en';
  try {
    await api(`/admin/api/invoices/${id}`, {
      method: 'PATCH',
      body: JSON.stringify({
        otp,
        ticket_no: document.getElementById('editTicket')?.value ?? '',
        buyer_ref: document.getElementById('editBuyerRef')?.value ?? '',
        asset: document.getElementById('editAsset')?.value ?? '',
        asset_amount: document.getElementById('editAssetAmount')?.value ?? '',
        memo: document.getElementById('editMemo')?.value ?? '',
        product_snapshot: {
          code: document.getElementById('editProdCode')?.value ?? '',
          name: document.getElementById('editProdName')?.value ?? '',
          description: document.getElementById('editProdDesc')?.value ?? '',
          unit: document.getElementById('editProdUnit')?.value ?? '',
          remark: document.getElementById('editProdRemark')?.value ?? '',
        },
      }),
    });
    await api(`/admin/api/invoices/${id}/regenerate-pdf?pdfLang=${encodeURIComponent(lang)}`, {
      method: 'POST',
      body: JSON.stringify({ pdfLang: lang }),
    });
    flash(t('invoices.saveEditOk'));
    invoices();
  } catch (e) {
    const msg = String(e.message || '');
    flash(msg.startsWith('api.error.') || msg.startsWith('invoices.') ? t(msg) : msg || t('error.generic'));
  }
}

function onInvoiceQFieldChange() {
  const field = document.getElementById('invQField');
  const input = document.getElementById('invQ');
  invoiceQField = field?.value || '';
  if (input) {
    input.disabled = !invoiceQField;
    if (!invoiceQField) {
      input.value = '';
      invoiceQ = '';
    } else {
      input.focus();
    }
  }
}

function sealPreview(siteId, kind, hasFile) {
  if (!hasFile) return `<div class="seal-preview empty" data-seal-kind="${kind}">${t('sites.noAsset')}</div>`;
  return `<div class="seal-preview" data-seal-kind="${kind}"><img src="/admin/api/sites/${siteId}/seals/${kind}?t=${Date.now()}" alt="${kind}" data-seal-src="1"/></div>`;
}

function updateSealComposePreview(siteId) {
  const stage = document.getElementById('sealComposeStage');
  if (!stage) return;
  const mode = document.querySelector('input[name="sealDisplayMode"]:checked')?.value || 'official_stamp';
  const sampleName =
    (document.getElementById('signatoryName')?.value || '').trim() ||
    (document.getElementById('siteSignatoryName')?.value || '').trim() ||
    'BYOUNGSUN YI';
  const has = (kind) => !!document.querySelector(`.seal-preview[data-seal-kind="${kind}"] img`);
  const img = (kind, cls) => {
    const el = document.querySelector(`.seal-preview[data-seal-kind="${kind}"] img`);
    if (!el) return '';
    return `<img class="${cls}" src="${el.getAttribute('src')}" alt="${kind}"/>`;
  };
  let html = '';
  if (mode === 'official_stamp') {
    html = `<div class="seal-compose-stack mode-official-stamp">
      <div class="sc-name-line"><span class="sc-name-label">Name</span> <span class="sc-name-value">${escHtml(sampleName)}</span></div>
      ${has('official') ? img('official', 'sc-official') : '<div class="sc-ph sc-official"></div>'}
      ${has('stamp') ? img('stamp', 'sc-stamp') : '<div class="sc-ph sc-stamp"></div>'}
    </div>`;
  } else if (mode === 'official') {
    html = `<div class="seal-compose-stack mode-official">
      <div class="sc-name-line"><span class="sc-name-label">Name</span> <span class="sc-name-value">${escHtml(sampleName)}</span></div>
      ${has('official') ? img('official', 'sc-official') : '<div class="sc-ph sc-official"></div>'}
    </div>`;
  } else if (mode === 'signature_stamp') {
    html = `<div class="seal-compose-stack mode-signature-stamp">
      <div class="sc-name-line"><span class="sc-name-label">Name</span> <span class="sc-name-value">${escHtml(sampleName)}</span></div>
      ${has('signature') ? img('signature', 'sc-signature') : '<div class="sc-ph sc-signature"></div>'}
      ${has('stamp') ? img('stamp', 'sc-stamp') : '<div class="sc-ph sc-stamp"></div>'}
    </div>`;
  } else if (mode === 'signature') {
    html = `<div class="seal-compose-stack mode-signature">
      <div class="sc-name-line"><span class="sc-name-label">Name</span> <span class="sc-name-value">${escHtml(sampleName)}</span></div>
      ${has('signature') ? img('signature', 'sc-signature') : '<div class="sc-ph sc-signature"></div>'}
    </div>`;
  } else {
    html = `<div class="seal-compose-stack mode-stamp">
      <div class="sc-name-line"><span class="sc-name-label">Name</span> <span class="sc-name-value">${escHtml(sampleName)}</span></div>
      ${has('stamp') ? img('stamp', 'sc-stamp-only') : '<div class="sc-ph sc-stamp-only"></div>'}
    </div>`;
  }
  const modeLabel = ({
    official_stamp: t('sites.modeOfficialStamp'),
    official: t('sites.modeOfficial'),
    signature_stamp: t('sites.modeSignatureStamp'),
    signature: t('sites.modeSignature'),
    stamp: t('sites.modeStamp'),
  })[mode] || mode;
  stage.innerHTML = `${html}<div class="seal-compose-caption">${escHtml(modeLabel)}</div>`;
}

function syncNoticeSlotUi() {
  const slot = document.getElementById('pdfNoticeSlot')?.value || 'off';
  document.querySelectorAll('.notice-slot-fields').forEach((el) => {
    el.classList.toggle('hidden', el.getAttribute('data-slot') !== slot || slot === 'off');
  });
  const remarksOn = document.getElementById('pdfRemarksEnabled')?.value !== 'false';
  document.getElementById('remarksFieldsBox')?.classList.toggle('hidden', !remarksOn);
  const lineSlot = document.getElementById('pdfLineSlot')?.value || 'off';
  document.querySelectorAll('.line-slot-fields').forEach((el) => {
    el.classList.toggle('hidden', el.getAttribute('data-slot') !== lineSlot || lineSlot === 'off');
  });
}

async function openSiteSeals(siteId) {
  const data = await api('/admin/api/sites');
  const s = (data.items || []).find((x) => x.id === siteId);
  if (!s) return;
  const box = document.getElementById('sealsBox');
  if (!box) return;
  const modeFromFlags = (o, st, g) => {
    if (o && st && !g) return 'official_stamp';
    if (o && !st && !g) return 'official';
    if (!o && st && g) return 'signature_stamp';
    if (!o && !st && g) return 'signature';
    if (!o && st && !g) return 'stamp';
    if (o && st && g) return 'official_stamp';
    if (o) return 'official';
    if (g && st) return 'signature_stamp';
    if (g) return 'signature';
    if (st) return 'stamp';
    return 'official_stamp';

  const curMode = modeFromFlags(
    s.seal_use_official !== false,
    s.seal_use_stamp !== false,
    s.seal_use_signature !== false,

  if (!['off', 'a', 'b', 'c'].includes(noticeSlot)) {
    noticeSlot = s.pdf_notice_enabled ? 'a' : 'off';

  const nameA = s.pdf_notice_a_name || t('sites.noticeActiveA');
  const nameB = s.pdf_notice_b_name || t('sites.noticeActiveB');
  const nameC = s.pdf_notice_c_name || t('sites.noticeActiveC');

function refreshNoticeSlotOptions() {

  const b = document.getElementById('pdfNotice_b_name')?.value || t('sites.noticeActiveB');

async function uploadSiteSeal(siteId, kind, input) {
  const file = input?.files?.[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch(`/admin/api/sites/${siteId}/seals/${kind}`, {
    method: 'POST',
    body: fd,
    credentials: 'same-origin',
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    flash(err.error || 'Upload failed');
    return;
  }
  flash(t('sites.sealSaved'));
  sites().then(() => openSiteSeals(siteId));
}

async function removeSiteSeal(siteId, kind) {
  if (!confirm(t('sites.removeAsset') + '?')) return;
  await api(`/admin/api/sites/${siteId}/seals/${kind}`, { method: 'DELETE', body: '{}' });
  sites().then(() => openSiteSeals(siteId));
}

async function saveSiteSealSettings(siteId) {
  const mode = document.querySelector('input[name="sealDisplayMode"]:checked')?.value || 'official_stamp';
  const flags = {
    official_stamp: { seal_use_official: true, seal_use_stamp: true, seal_use_signature: false },
    official: { seal_use_official: true, seal_use_stamp: false, seal_use_signature: false },
    signature_stamp: { seal_use_official: false, seal_use_stamp: true, seal_use_signature: true },
    signature: { seal_use_official: false, seal_use_stamp: false, seal_use_signature: true },
    stamp: { seal_use_official: false, seal_use_stamp: true, seal_use_signature: false },
  }[mode] || { seal_use_official: true, seal_use_stamp: true, seal_use_signature: false };
  const slot = document.getElementById('pdfNoticeSlot')?.value || 'off';
  const lineSlot = document.getElementById('pdfLineSlot')?.value || 'off';
  const pack = (key) => ({
    [`pdf_notice_${key}_name`]: document.getElementById(`pdfNotice_${key}_name`)?.value || '',
    [`pdf_notice_${key}_text`]: document.getElementById(`pdfNotice_${key}_text`)?.value || '',
    [`pdf_notice_${key}_bank_name`]: document.getElementById(`pdfNotice_${key}_bankName`)?.value || '',

function partyFormPrefix(kind) {
  return kind === 'seller' ? 'ps' : 'pb';
}

function parsePartyBankInfo(raw) {
  if (!raw) return {};
  if (typeof raw === 'object' && raw && !Array.isArray(raw)) return raw;
  try {
    const j = JSON.parse(String(raw));
    if (j && typeof j === 'object' && !Array.isArray(j)) return j;
  } catch { /* plain */ }
  return {};
}

function collectPartyBankInfo(prefix) {
  const keys = ['bankName', 'accountNo', 'accountName', 'bankAddress', 'branchName', 'swiftCode', 'fax', 'website'];
  const out = {};
  for (const k of keys) {
    const el = document.getElementById(prefix + 'Bank_' + k);
    const v = String(el?.value || '').trim();
    if (v) out[k] = v;
  }
  return Object.keys(out).length ? JSON.stringify(out) : '';
}

function fillPartyBankInfo(prefix, raw) {
  const bank = parsePartyBankInfo(raw);
  const map = {
    bankName: bank.bankName || bank.bank || '',
    accountNo: bank.accountNo || bank.acNo || '',
    accountName: bank.accountName || bank.acName || '',
    bankAddress: bank.bankAddress || bank.bankAdd || '',
    branchName: bank.branchName || bank.branch || '',
    swiftCode: bank.swiftCode || bank.swift || '',
    fax: bank.fax || '',
    website: bank.website || '',
  };
  Object.entries(map).forEach(([k, v]) => {
    const el = document.getElementById(prefix + 'Bank_' + k);
    if (el) el.value = v;
  });
}

function partyFormPayload(kind) {
  const prefix = partyFormPrefix(kind);
  const payload = {
    site_id: document.getElementById(prefix + 'Site')?.value,
    kind,
    code: document.getElementById(prefix + 'Code')?.value,
    legal_name: document.getElementById(prefix + 'Legal')?.value,
    signatory_name: document.getElementById(prefix + 'SignName')?.value,
    signatory_title: document.getElementById(prefix + 'SignTitle')?.value,
    address: document.getElementById(prefix + 'Address')?.value,
    phone: document.getElementById(prefix + 'Phone')?.value,
    website: document.getElementById(prefix + 'Web')?.value,
    country: document.getElementById(prefix + 'Country')?.value,
    email: document.getElementById(prefix + 'Email')?.value,
    tax_id: document.getElementById(prefix + 'Tax')?.value,
  };
  if (kind === 'seller') {
    payload.bank_info = collectPartyBankInfo(prefix);
  }
  return payload;
}

function fillPartyForm(p) {
  const kind = p.kind === 'buyer' ? 'buyer' : 'seller';
  const prefix = partyFormPrefix(kind);
  const set = (id, v) => {
    const el = document.getElementById(id);
    if (el) el.value = v ?? '';
  };
  set(prefix + 'Site', p.site_id || '');
  set(prefix + 'Code', p.code || '');
  set(prefix + 'Legal', p.legal_name || '');
  set(prefix + 'SignName', p.signatory_name || '');
  set(prefix + 'SignTitle', p.signatory_title || '');
  set(prefix + 'Address', p.address || '');
  set(prefix + 'Phone', p.phone || '');
  set(prefix + 'Web', p.website || '');
  set(prefix + 'Country', p.country || '');
  set(prefix + 'Email', p.email || '');
  set(prefix + 'Tax', p.tax_id || '');
  if (kind === 'seller') fillPartyBankInfo(prefix, p.bank_info);
}

async function savePartyKind(kind) {
  const payload = partyFormPayload(kind);
  const editId = editingPartyId || document.getElementById('partyEditId')?.value || '';
  try {
    if (editId) {
      // Edit: code is immutable — never send code on PATCH
      delete payload.code;
      await api(`/admin/api/parties/${editId}`, {
        method: 'PATCH',
        body: JSON.stringify(payload),
      });
      flash(t('parties.updated'));
    } else {
      const code = String(payload.code || '').trim();
      if (!code) {
        flash(t('parties.codeRequired'));
        return;
      }
      if (copyingPartyId) {
        const src = partiesCache.find((x) => x.id === copyingPartyId);
        if (src && String(src.code).toLowerCase() === code.toLowerCase()) {
          flash(t('parties.codeMustDiffer'));
          return;
        }
      }
      await api('/admin/api/parties', {
        method: 'POST',
        body: JSON.stringify(payload),
      });
      flash(copyingPartyId ? t('parties.copied') : t('parties.saved'));
    }
    editingPartyId = null;
    copyingPartyId = null;
    partyTab = kind === 'seller' ? 'seller' : 'buyer';
    parties();
  } catch (e) {
    const msg = String(e.message || '');
    flash(msg.startsWith('parties.') ? t(msg) : msg || t('error.generic'));
  }
}

async function createPartyKind(kind) {
  return savePartyKind(kind);
}

async function deleteParty(id, code) {
  if (!confirm(t('parties.deleteConfirm', { code }))) return;
  try {
    await api(`/admin/api/parties/${id}`, { method: 'DELETE', body: '{}' });
    if (editingPartyId === id) editingPartyId = null;
    if (copyingPartyId === id) copyingPartyId = null;
    flash(t('parties.deleted'));
    parties();
  } catch (e) {
    const msg = String(e.message || '');
    flash(msg.startsWith('parties.') ? t(msg) : msg || t('error.generic'));
  }
}

function filterMappingParties() {
  const siteId = document.getElementById('mSite')?.value;
  ['mSeller','mBuyer'].forEach((id) => {
    const sel = document.getElementById(id);
    if (!sel) return;
    [...sel.options].forEach((o) => {
      if (!o.value) return;
      const match = !siteId || o.dataset.site === siteId || !o.dataset.site;
      o.hidden = !match;
    });
    const visible = [...sel.options].find((o) => o.value && !o.hidden);
    if (visible && sel.selectedOptions[0]?.hidden) sel.value = visible.value;
  });
}

  editingMappingSiteId = siteId;

async function uploadBrand(asset, input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch('/admin/api/platform/branding/' + asset, {
      method: 'POST', credentials: 'include', body: fd, headers: { 'Accept-Language': LANG },
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || t('error.generic'));
    flash(t('platform.assetUploaded'));
    await applyBranding();
    platform();
  } catch (err) {
    flash(err.message || t('error.generic'));
  }
}

async function applyBranding() {
  try {
    const b = await fetch('/api/branding', { credentials: 'same-origin' }).then((r) => r.json());
    const title = b.tabTitle || b.siteName || t('app.title');
    document.title = title;
    if (b.faviconUrl) {
      let link = document.querySelector('link[rel="icon"]');
      if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
      link.href = b.faviconUrl;
    }
    const shellImg = document.getElementById('shellLogoImg');
    const shellText = document.getElementById('shellLogoText');
    if (shellImg && shellText) {
      if (b.logoUrl) {
        shellImg.src = b.logoUrl;
        shellImg.classList.remove('hidden');
        shellText.classList.add('hidden');
      } else {
        shellImg.classList.add('hidden');
        shellText.classList.remove('hidden');
        shellText.textContent = b.siteName || t('app.brand');
      }
    }
    const authWrap = document.getElementById('authLogoWrap');
    const authImg = document.getElementById('authLogoImg');
    if (authWrap && authImg) {
      if (b.authLogoUrl || b.logoUrl) {
        authImg.src = b.authLogoUrl || b.logoUrl;
        authWrap.classList.remove('hidden');
      } else authWrap.classList.add('hidden');
    }
    const footerText = String(b.footerText || '').trim() || b.siteName || t('app.brand');
    ['loginFooter', 'shellFooter'].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.textContent = footerText;
    });
  } catch { /* ignore */ }
}

async function audit() {
  const today = new Date();
  const toDef = today.toISOString().slice(0, 10);
  const fromDate = new Date(today);
  fromDate.setDate(fromDate.getDate() - 30);
  const fromDef = fromDate.toISOString().slice(0, 10);

  content.innerHTML = `<div class="pg-card audit-page"><div class="pg-card-head">${t('audit.title')}</div><div class="pg-card-body">
    <p class="pg-card-hint">${t('audit.hint')}</p>
    <div class="pg-row" style="flex-wrap:wrap;gap:10px;align-items:end">
      <div><label class="pg-label">${t('audit.from')}</label><input class="pg-input" id="aFrom" type="date" value="${fromDef}"/></div>
      <div><label class="pg-label">${t('audit.to')}</label><input class="pg-input" id="aTo" type="date" value="${toDef}"/></div>
      <div><label class="pg-label">${t('audit.category')}</label>
        <select class="pg-input" id="aCat">
          <option value="">${t('audit.categoryAll')}</option>
          <option value="invoice">${t('audit.category.invoice')}</option>
          <option value="admin">${t('audit.category.admin')}</option>
          <option value="site">${t('audit.category.site')}</option>
          <option value="master">${t('audit.category.master')}</option>
          <option value="platform">${t('audit.category.platform')}</option>
        </select>
      </div>
      <div style="min-width:180px"><label class="pg-label">${t('audit.q')}</label><input class="pg-input" id="aQ" placeholder="${t('audit.qPh')}"/></div>
      <button class="pg-btn pg-btn-primary" type="button" id="aSearchBtn">${t('audit.search')}</button>
      <button class="pg-btn" type="button" onclick="exportAudit('json')">${t('audit.exportJson')}</button>
      <button class="pg-btn" type="button" onclick="exportAudit('csv')">${t('audit.exportCsv')}</button>
    </div>
    <div id="aMeta" class="pg-card-hint" style="margin-top:12px"></div>
    <div style="overflow:auto;margin-top:8px">
      <table class="pg-table audit-table" id="aTable">
        <thead><tr>
          <th>${t('audit.col.time')}</th>
          <th>${t('audit.col.action')}</th>
          <th>${t('audit.col.who')}</th>
          <th>${t('audit.col.site')}</th>
          <th>${t('audit.col.invoice')}</th>
          <th>${t('audit.col.detail')}</th>
          <th>${t('audit.col.ip')}</th>
        </tr></thead>
        <tbody id="aBody"><tr><td colspan="7">${t('audit.loading')}</td></tr></tbody>
      </table>
    </div>
    <div class="pg-row" style="margin-top:12px;gap:8px;align-items:center">
      <button class="pg-btn" type="button" id="aPrevBtn">${t('audit.prev')}</button>
      <span id="aPageInfo" class="pg-card-hint"></span>
      <button class="pg-btn" type="button" id="aNextBtn">${t('audit.next')}</button>
    </div>
  </div></div>`;

  window.__auditState = { offset: 0, limit: 50, total: 0 };
  document.getElementById('aSearchBtn')?.addEventListener('click', () => {
    window.__auditState.offset = 0;
    loadAuditRows();
  });
  document.getElementById('aPrevBtn')?.addEventListener('click', () => {
    window.__auditState.offset = Math.max(0, window.__auditState.offset - window.__auditState.limit);
    loadAuditRows();
  });
  document.getElementById('aNextBtn')?.addEventListener('click', () => {
    const st = window.__auditState;
    if (st.offset + st.limit < st.total) {
      st.offset += st.limit;
      loadAuditRows();
    }
  });
  document.getElementById('aQ')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      window.__auditState.offset = 0;
      loadAuditRows();
    }
  });
  await loadAuditRows();
}

function auditEventLabel(eventType) {
  const key = 'audit.event.' + String(eventType || '');
  const label = t(key);
  return label === key ? eventType : label;
}

function auditDetailText(row) {
  const d = row.detail_json || {};
  const parts = [];
  if (d.invoiceNo) parts.push(d.invoiceNo);
  if (d.from && d.to) parts.push(`${d.from} → ${d.to}`);
  if (d.amount != null && d.currency) parts.push(`${d.amount} ${d.currency}`);
  else if (d.amount != null) parts.push(String(d.amount));
  if (d.buyer) parts.push(`${t('audit.detail.buyer')}: ${d.buyer}`);
  if (d.seller) parts.push(`${t('audit.detail.seller')}: ${d.seller}`);
  if (d.product) parts.push(`${t('audit.detail.product')}: ${d.product}`);
  if (d.ticketNo) parts.push(`${t('audit.detail.ticket')}: ${d.ticketNo}`);
  if (d.transactionId) parts.push(`TX: ${d.transactionId}`);
  if (d.email) parts.push(d.email);
  if (d.code && !d.invoiceNo) parts.push(d.code);
  if (d.name && !d.legalName) parts.push(d.name);
  if (d.legalName) parts.push(d.legalName);
  if (d.kind && (String(row.event_type || '').startsWith('site.seal') || String(row.event_type || '').startsWith('party.'))) {
    parts.push(d.kind);
  }
  if (d.label) parts.push(d.label);
  if (d.keyPrefix) parts.push(d.keyPrefix + '…');
  if (d.asset) parts.push(d.asset);
  if (d.locale) parts.push(d.locale);
  if (d.target && !d.email) parts.push(String(d.target).slice(0, 8) + '…');
  if (parts.length) return parts.join(' · ');
  try {
    const raw = JSON.stringify(d);
    return raw === '{}' ? '—' : raw.length > 120 ? raw.slice(0, 117) + '…' : raw;
  } catch {
    return '—';
  }
}

function auditWho(row) {
  const label = (row.actor_label || '').trim();
  const email = (row.actor_email || '').trim();
  const typeKey = 'audit.actor.' + (row.actor_type || 'system');
  const typeLabel = t(typeKey) === typeKey ? row.actor_type : t(typeKey);
  if (label && email && label !== email) return `${label} (${email}) · ${typeLabel}`;
  if (label) return `${label} · ${typeLabel}`;
  if (row.actor_id) return `${row.actor_id} · ${typeLabel}`;
  return typeLabel;
}

async function loadAuditRows() {
  const st = window.__auditState || { offset: 0, limit: 50, total: 0 };
  const from = document.getElementById('aFrom')?.value || '';
  const to = document.getElementById('aTo')?.value || '';
  const category = document.getElementById('aCat')?.value || '';
  const q = document.getElementById('aQ')?.value?.trim() || '';
  const params = new URLSearchParams({
    limit: String(st.limit),
    offset: String(st.offset),
  });
  if (from) params.set('from', from);
  if (to) params.set('to', to);
  if (category) params.set('category', category);
  if (q) params.set('q', q);
  const body = document.getElementById('aBody');
  if (body) body.innerHTML = `<tr><td colspan="7">${t('audit.loading')}</td></tr>`;
  try {
    const data = await api(`/admin/api/audit?${params.toString()}`);
    st.total = data.total || 0;
    st.limit = data.limit || st.limit;
    st.offset = data.offset || 0;
    window.__auditState = st;
    const items = data.items || [];
    const meta = document.getElementById('aMeta');
    if (meta) meta.textContent = t('audit.meta', { total: st.total, shown: items.length });
    const pageInfo = document.getElementById('aPageInfo');
    const page = Math.floor(st.offset / st.limit) + 1;
    const pages = Math.max(1, Math.ceil(st.total / st.limit));
    if (pageInfo) pageInfo.textContent = t('audit.page', { page, pages });
    if (!body) return;
    if (!items.length) {
      body.innerHTML = `<tr><td colspan="7">${t('audit.empty')}</td></tr>`;
      return;
    }
    body.innerHTML = items.map((row) => {
      const important = String(row.event_type || '').startsWith('invoice.issued') ||
        String(row.event_type || '') === 'invoice.reissued' ||
        String(row.event_type || '') === 'invoice.voided';
      const trStyle = important ? ' style="background:rgba(37,99,235,0.06)"' : '';
      const when = row.created_at ? formatAccessTime(new Date(row.created_at)) : '—';
      const inv = row.invoice_no || (row.detail_json && row.detail_json.invoiceNo) || '—';
      return `<tr${trStyle}>
        <td class="mono" style="white-space:nowrap">${esc(when)}</td>
        <td><strong>${esc(auditEventLabel(row.event_type))}</strong><div class="mono" style="opacity:.65;font-size:11px">${esc(row.event_type)}</div></td>
        <td>${esc(auditWho(row))}</td>
        <td class="mono">${esc(row.site_code || '—')}</td>
        <td class="mono">${esc(inv)}</td>
        <td>${esc(auditDetailText(row))}</td>
        <td class="mono">${esc(row.ip || '—')}</td>
      </tr>`;
    }).join('');
  } catch (e) {
    if (body) body.innerHTML = `<tr><td colspan="7">${esc(e.message || t('error.generic'))}</td></tr>`;
  }
}

function esc(s){
  return String(s??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

async function saveSite() {
  const editId = document.getElementById('siteEditId')?.value || '';
  const code = document.getElementById('siteCode')?.value?.trim() || '';
  const name = document.getElementById('siteName')?.value?.trim() || '';
  const notes = document.getElementById('siteNotes')?.value || '';
  const active = document.getElementById('siteActive')?.value !== 'false';
  if (!name) { flash(t('sites.nameRequired')); return; }
  try {
    if (editId) {
      await api(`/admin/api/sites/${editId}`, {
        method: 'PATCH',
        body: JSON.stringify({ name, notes, active }),
      });
      flash(t('sites.updated'));
    } else {
      if (!code) { flash(t('sites.codeRequired')); return; }
      await api('/admin/api/sites', {
        method: 'POST',
        body: JSON.stringify({ code, name, notes, active }),
      });
      flash(t('sites.created'));
    }
    sites();
  } catch (e) {
    flash(e.message || t('error.generic'));
  }
}

function cancelSiteEdit() {
  document.getElementById('siteEditId').value = '';
  document.getElementById('siteCode').value = '';
  document.getElementById('siteCode').disabled = false;
  document.getElementById('siteName').value = '';
  document.getElementById('siteNotes').value = '';
  document.getElementById('siteActive').value = 'true';
  document.getElementById('siteSaveBtn').textContent = t('sites.add');
  document.getElementById('siteCancelBtn').classList.add('hidden');
}

async function editSite(siteId) {
  const data = await api('/admin/api/sites');
  const s = (data.items || []).find((x) => x.id === siteId);
  if (!s) return;
  document.getElementById('siteEditId').value = s.id;
  document.getElementById('siteCode').value = s.code || '';
  document.getElementById('siteCode').disabled = true;
  document.getElementById('siteName').value = s.name || '';
  document.getElementById('siteNotes').value = s.notes || '';
  document.getElementById('siteActive').value = s.active === false ? 'false' : 'true';
  document.getElementById('siteSaveBtn').textContent = t('sites.saveEdit');
  document.getElementById('siteCancelBtn').classList.remove('hidden');
  document.getElementById('siteName')?.focus();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteSite(siteId, code) {
  if (!confirm(t('sites.deleteConfirm', { code }))) return;
  try {
    await api(`/admin/api/sites/${siteId}`, { method: 'DELETE', body: '{}' });
    flash(t('sites.deleted'));
    sites();
  } catch (e) {
    const msg = String(e.message || '');
    flash(msg.startsWith('sites.') ? t(msg) : msg || t('error.generic'));
  }
}

async function createSite(){ return saveSite(); }

async function revokeKey(id,siteId){ if(!confirm(t('sites.revokeConfirm')))return; await api(`/admin/api/keys/${id}/revoke`,{method:'POST',body:'{}'}); listKeys(siteId); }
async function reissueInvoice(id) {
  if (!confirm(t('invoices.reissueConfirm'))) return;
  try {
    const d = await api(`/admin/api/invoices/${id}/reissue`, { method: 'POST', body: '{}' });

    invoices();
  } catch (e) {
    const msg = String(e.message || '');
    flash(msg.startsWith('api.error.') || msg.startsWith('invoices.') ? t(msg) : msg || t('error.generic'));
  }
}

(async function init(){
  // 1) 항상 로그인 화면부터 — 잔여 키/상태로 관리 창이 먼저 보이지 않게
  showLoginOnly();
  applyShellTheme();
  await loadI18n(LANG);

  try {
    publicCfg = await fetchPublicConfig();
  } catch {
    publicCfg = { turnstileEnabled: false, turnstileSiteKey: '', turnstileDisplayMode: 'text' };
  }

  // 2) 이 탭에서 로그인 완료 표시가 있을 때만 세션 복원 (Crypto sessionStorage 토큰과 동일 취지)
  let tabOk = false;
  try { tabOk = sessionStorage.getItem('invoice_shell_ok') === '1'; } catch { tabOk = false; }

  if (tabOk) {
    const admin = await probeSession().catch(() => null);
    if (admin?.id && admin.email) {
      boot(admin);
      return;
    }
  }

  // 쿠키만 있거나 탭 표시 없음 → 관리 창 금지, 서버 세션·클라이언트 잔여 정리
  try { sessionStorage.removeItem('invoice_shell_ok'); } catch { /* ignore */ }
  clearClientAuthResidue();
  try {
    await fetch('/admin/api/auth/logout', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' }, body: '{}',
    });
  } catch { /* ignore */ }

  showLoginOnly();
  await mountTurnstile();
  applyI18n();
})();
